name: pre-commit hooks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-pre-commit-hooks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - name: set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'
          cache: 'yarn'

      - name: install dependencies
        run: yarn install --frozen-lockfile

      - name: run pre-commit hooks
        run: |
          yarn lint-staged
          yarn lint:versions
          yarn lint:dependencies

      # Whole-tree, check-only formatting gate. `lint-staged` above only inspects
      # staged files (empty on a fresh CI checkout) and runs `oxfmt --write`, which
      # always exits 0. This step runs `oxfmt --check` over the entire tree and
      # fails if anything is unformatted, blocking unformatted code from merging
      # (which otherwise only surfaces post-merge in the preview build).
      - name: check formatting
        run: yarn format:check
